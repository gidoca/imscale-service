<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #ddd;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            aspect-ratio: 4/3;
            background-color: #ecf0f1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 10px;
            text-align: center;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .gallery-item.directory {
            background-color: #3498db;
            color: white;
        }

        .gallery-item.directory:hover {
            background-color: #2980b9;
        }

        .gallery-item .file-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover .file-info {
            opacity: 1;
        }

        .gallery-item .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .gallery-item.directory .icon {
            color: white;
        }

        .gallery-item .name {
            font-weight: bold;
            margin-top: 5px;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .popover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .popover.active {
            opacity: 1;
            pointer-events: all;
        }

        .popover-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .popover-content img {
            max-width: 90vw;
            max-height: 80vh;
            display: block;
            margin: 0 auto;
        }

        .popover-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .download-btn {
            position: absolute;
            top: 20px;
            right: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            text-decoration: none;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .image-info {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            margin: 0 20px;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .preload-container {
            position: fixed;
            top: -1000px;
            left: -1000px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .path-breadcrumb {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .path-breadcrumb a {
            color: #3498db;
            text-decoration: none;
        }

        .path-breadcrumb a:hover {
            text-decoration: underline;
        }

        .path-breadcrumb span {
            color: #666;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .popover-nav {
                padding: 0 10px;
            }

            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-images"></i> Image Gallery</h1>
            <p>Browse and view your images</p>
        </header>

        <div class="path-breadcrumb" id="current-path">
            <!-- Path breadcrumb will be generated here -->
        </div>

        <div class="controls">
            <label for="sort-by">Sort by:</label>
            <select id="sort-by">
                <option value="name">Name</option>
                <option value="modified">Date</option>
                <option value="size">Size</option>
                <option value="type">Type</option>
            </select>
            <select id="sort-direction">
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
            </select>
            <button id="up-button" class="btn" disabled><i class="fas fa-level-up-alt"></i> Up</button>
        </div>

        <div id="image-grid" class="gallery"></div>
    </div>

<div id="popover" class="popover">
             <div id="spinner" class="spinner"></div>
             <img id="popover-image" src="" alt="Enlarged Image" fetchpriority="high">
             <div class="popover-nav">
                 <button id="prev-button" class="nav-btn"><i class="fas fa-chevron-left"></i></button>
                 <button id="next-button" class="nav-btn"><i class="fas fa-chevron-right"></i></button>
             </div>
             <button id="close-button" class="close-btn"><i class="fas fa-times"></i></button>
             <a id="download-button" class="download-btn" download>&#x1F4BE;</a>
             <div id="imageInfo" class="image-info"></div>
     </div>
    </div>

    <div id="preloadContainer" class="preload-container"></div>

    <script>
        let currentPath = '';
        let imageList = [];
        let items = [];
        let currentImageIndex = -1;
        const popover = document.getElementById('popover');
        const popoverImage = document.getElementById('popover-image');
        const closeButton = document.getElementById('close-button');
        let currentPopoverUpdater = null;

        function createImageUpdater(imageElement, imagePath) {
            let lastWidth = 0;
            let lastHeight = 0;
            let debounceTimeout;

            function update() {
                const imageWidth = imageElement.parentElement.offsetWidth;
                const imageHeight = imageElement.parentElement.offsetHeight;

                if (imageWidth > lastWidth || imageHeight > lastHeight) {
                    const imageUrl = `/download/${imagePath}?width=${imageWidth}&height=${imageHeight}&preserve_aspect_ratio=true`;
                    imageElement.src = imageUrl;
                    lastWidth = imageWidth;
                    lastHeight = imageHeight;
                }
            }

            function debouncedUpdate() {
                clearTimeout(debounceTimeout);
                debounceTimeout = setTimeout(update, 500);
            }

            return {
                update,
                debouncedUpdate
            };
        }

        function navigate(path) {
            history.pushState({ path: path }, '', path ? `#/list/${path}` : '#/');
            loadImages(path);
        }

        async function loadImages(path) {
            currentPath = path;
            const currentPathElement = document.getElementById('current-path');
            const pathParts = path.split('/');
            const homeElement = document.createElement('a');
            homeElement.textContent = 'Home';
            homeElement.addEventListener('click', () => navigate(''));
            var pathPartElements = [homeElement];
            for (const [index, pathPart] of pathParts.entries()) {
                const separatorElement = document.createElement('span');
                separatorElement.textContent = ' / ';
                pathPartElements.push(separatorElement);

                const pathPartElement = document.createElement('a');
                pathPartElement.className = 'current-path-part';
                pathPartElement.textContent = pathPart;
                const currentPath = pathParts.slice(0, index + 1).join('/');
                pathPartElement.addEventListener('click', () => navigate(currentPath));
                pathPartElements.push(pathPartElement);
            }
            currentPathElement.replaceChildren(...pathPartElements);
            document.getElementById('up-button').disabled = path === '';

            const response = await fetch(`/list/${path}`);
            items = await response.json();
            sortAndRenderItems();
        }

        function sortAndRenderItems() {
            const sortBy = document.getElementById('sort-by').value;
            const sortDirection = document.getElementById('sort-direction').value;

            items.sort((a, b) => {
                let aValue = a[sortBy];
                let bValue = b[sortBy];

                if (sortBy === 'name' || sortBy === 'type') {
                    aValue = aValue.toLowerCase();
                    bValue = bValue.toLowerCase();
                }

                if (aValue < bValue) {
                    return sortDirection === 'asc' ? -1 : 1;
                }
                if (aValue > bValue) {
                    return sortDirection === 'asc' ? 1 : -1;
                }
                return 0;
            });

            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('image-grid');
            grid.innerHTML = '';
            imageList = items.filter(item => item.type === 'image').map(item => currentPath ? `${currentPath}/${item.name}` : item.name);

            for (const item of items) {
                const gridItem = document.createElement('div');
                gridItem.className = 'gallery-item';
                grid.appendChild(gridItem);

                if (item.type === 'image') {
                    const img = document.createElement('img');

                    const imagePath = currentPath ? `${currentPath}/${item.name}` : item.name;
                    const imageIndex = imageList.indexOf(imagePath);
                    gridItem.appendChild(img);
                    const imageWidth = img.offsetWidth;
                    const imageHeight = img.offsetHeight;
                    img.src = `/download/${imagePath}?width=${imageWidth}&height=${imageHeight}&preserve_aspect_ratio=true`;
                    gridItem.addEventListener('click', () => openPopover(imagePath, imageIndex));
                } else if (item.type === 'directory') {
                    const fullPath = currentPath ? `${currentPath}/${item.name}` : item.name;

                    gridItem.classList.add('directory');
                    gridItem.addEventListener('click', () => navigate(fullPath));

                    // Create directory icon
                    const icon = document.createElement('div');
                    icon.className = 'icon';
                    icon.innerHTML = '<i class="fas fa-folder"></i>';

                    gridItem.appendChild(icon);
                } else {
                    const img = document.createElement('img');

                    img.src = '/icons/text-document-dual-tone-icon.svg';
                    gridItem.appendChild(img);
                }


                const filename = document.createElement('div');
                filename.className = 'name';
                filename.textContent = item.name;
                gridItem.appendChild(filename);
            }
        }

        document.getElementById('sort-by').addEventListener('change', sortAndRenderItems);
        document.getElementById('sort-direction').addEventListener('change', sortAndRenderItems);

        const spinner = document.getElementById('spinner');

        popoverImage.onload = () => {
            spinner.style.display = 'none';
            // Remove any existing error message
            const existingError = popover.querySelector('.error-message');
            if (existingError) {
                existingError.remove();
            }
        };

        // Remove any existing error message
            const existingError = popover.querySelector('.error-message');
            if (existingError) {
                existingError.remove();
            }
            
            spinner.style.display = 'none';
            console.error('Failed to load image:', popoverImage.src);
            // Show error message to user
            const errorMsg = document.createElement('div');
            errorMsg.className = 'error-message';
            errorMsg.textContent = 'Failed to load image';
            errorMsg.style.color = 'white';
            errorMsg.style.textAlign = 'center';
            errorMsg.style.padding = '10px';
            errorMsg.style.position = 'absolute';
            errorMsg.style.top = '50%';
            errorMsg.style.left = '50%';
            errorMsg.style.transform = 'translate(-50%, -50%)';
            errorMsg.style.zIndex = '10';
            popover.appendChild(errorMsg);

        function openPopover(imagePath, imageIndex) {
            history.pushState({ imagePath: imagePath, imageIndex: imageIndex }, '', `#/show/${imagePath}`);
            openPopoverForReal(imagePath, imageIndex);
        }

        function closePopover() {
            history.pushState({ path: currentPath }, '', currentPath ? `#/list/${currentPath}` : '#/');
            closePopoverForReal();
        }

        document.getElementById('up-button').addEventListener('click', () => {
            const pathParts = currentPath.split('/');
            pathParts.pop();
            navigate(pathParts.join('/'));
        });

        closeButton.addEventListener('click', closePopover);
        popover.addEventListener('click', (e) => {
            if (e.target === popover) {
                closePopover();
            }
        });

        function updateNavButtons() {
            document.getElementById('prev-button').style.display = currentImageIndex > 0 ? 'block' : 'none';
            document.getElementById('next-button').style.display = currentImageIndex < imageList.length - 1 ? 'block' : 'none';
        }

        function showPrevImage() {
            if (currentImageIndex > 0) {
                openPopover(imageList[currentImageIndex - 1], currentImageIndex - 1);
            }
        }

        function showNextImage() {
            if (currentImageIndex < imageList.length - 1) {
                openPopover(imageList[currentImageIndex + 1], currentImageIndex + 1);
            }
        }

        document.getElementById('prev-button').addEventListener('click', (e) => {
            e.stopPropagation();
            showPrevImage();
        });

        document.getElementById('next-button').addEventListener('click', (e) => {
            e.stopPropagation();
            showNextImage();
        });

        window.addEventListener('keydown', (e) => {
            if (!popover.classList.contains('active')) return;
            if (e.key === 'Escape') {
                closePopover();
            }
            if (e.key === 'ArrowLeft') {
                showPrevImage();
            }
            if (e.key === 'ArrowRight') {
                showNextImage();
            }
        });

        window.addEventListener('popstate', (event) => {
            handleLocation();
        });

        function handleLocation() {
            const hash = window.location.hash;

            if (hash.startsWith('#/show/')) {
                const imagePath = hash.substring(7);
                const imageIndex = imageList.indexOf(imagePath);

                // If the image is not in the current list, load the directory first.
                if (imageIndex === -1) {
                    const pathParts = imagePath.split('/');
                    pathParts.pop();
                    loadImages(pathParts.join('/')).then(() => {
                        const imageIndex = imageList.indexOf(imagePath);
                        if (imageIndex !== -1) {
                            openPopoverForReal(imagePath, imageIndex);
                        }
                    });
                } else {
                    openPopoverForReal(imagePath, imageIndex);
                }
            } else if (hash.startsWith('#/list/')) {
                const path = hash.substring(7);
                closePopoverForReal();
                loadImages(path);
            } else {
                closePopoverForReal();
                loadImages('');
            }
        }

        function openPopoverForReal(imagePath, imageIndex) {
            currentImageIndex = imageIndex;
            updateNavButtons();

            if (currentPopoverUpdater) {
                window.removeEventListener('resize', currentPopoverUpdater.debouncedUpdate);
            }

            document.getElementById('download-button').href = `/download/${imagePath}`;

            spinner.style.display = 'block';
            currentPopoverUpdater = createImageUpdater(popoverImage, imagePath);
            popover.classList.add('active');

            setTimeout(() => {
                currentPopoverUpdater.update();
                window.addEventListener('resize', currentPopoverUpdater.debouncedUpdate);
            }, 0);
        }

        function closePopoverForReal() {
            popover.classList.remove('active');
            popoverImage.src = '';
            spinner.style.display = 'none';
            if (currentPopoverUpdater) {
                window.removeEventListener('resize', currentPopoverUpdater.debouncedUpdate);
                currentPopoverUpdater = null;
            }
        }

        window.addEventListener('load', () => handleLocation());
    </script>
</body>

</html>
